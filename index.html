<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Séances">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Séances</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- Écran de chargement : styles en ligne pour qu'il s'affiche dès la première image -->
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 100; background: #0c0c0f; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      transition: opacity .4s ease, transform .4s ease;
    }
    #splash svg { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 18px 50px rgba(0, 0, 0, .55); animation: spPop .6s cubic-bezier(.3, 1.5, .5, 1) both; }
    #splash .sp-bar { transform-box: fill-box; transform-origin: center bottom; animation: spBar .5s cubic-bezier(.3, 1.4, .5, 1) both; }
    #splash .sp-bar:nth-of-type(1) { animation-delay: .18s; }
    #splash .sp-bar:nth-of-type(2) { animation-delay: .3s; }
    #splash .sp-bar:nth-of-type(3) { animation-delay: .42s; }
    #splash .sp-name { font: 700 1.6rem/1 "Fraunces", Georgia, serif; letter-spacing: .01em; animation: spUp .5s ease .45s both; }
    #splash .sp-load { width: 44px; height: 3px; border-radius: 99px; background: rgba(255, 255, 255, .15); overflow: hidden; animation: spUp .4s ease .6s both; }
    #splash .sp-load i { display: block; width: 40%; height: 100%; border-radius: 99px; background: #fff; animation: spLoad 1s ease-in-out .7s infinite; }
    #splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
    @keyframes spPop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes spBar { from { transform: scaleY(0); } to { transform: none; } }
    @keyframes spUp { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes spLoad { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: opacity .2s; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 512 512">
      <defs>
        <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2c32"/><stop offset="1" stop-color="#0a0a0c"/></linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#spBg)"/>
      <rect class="sp-bar" x="137" y="269" width="62" height="118" rx="31" fill="#fff" fill-opacity=".55"/>
      <rect class="sp-bar" x="225" y="199" width="62" height="188" rx="31" fill="#fff" fill-opacity=".8"/>
      <rect class="sp-bar" x="313" y="125" width="62" height="262" rx="31" fill="#fff"/>
    </svg>
    <div class="sp-name">Séances</div>
    <div class="sp-load"><i></i></div>
  </div>

  <main id="main"></main>

  <div id="timer" hidden>
    <svg id="timerRing" viewBox="0 0 36 36" aria-hidden="true"><circle class="tr-bg" cx="18" cy="18" r="15"/><circle class="tr-fg" id="timerArc" cx="18" cy="18" r="15"/></svg>
    <span id="timerLabel">Repos</span>
    <strong id="timerVal"></strong>
    <button data-act="timerAdd">+15 s</button>
    <button data-act="timerStop">Passer</button>
  </div>

  <nav id="tabbar" class="glassbar" aria-label="Navigation"></nav>

  <div id="toast" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
