<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Séances</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main"></main>

  <!-- Minuteur de repos (toujours présent, mis à jour sans re-rendu) -->
  <div id="timer" hidden>
    <span id="timerLabel">Repos</span>
    <strong id="timerVal"></strong>
    <button data-act="timerAdd">+15 s</button>
    <button data-act="timerStop">Passer</button>
  </div>

  <nav id="tabbar" class="tabbar">
    <button data-act="tab" data-tab="today"><span>🏠</span>Aujourd'hui</button>
    <button data-act="tab" data-tab="programs"><span>📋</span>Programmes</button>
    <button data-act="tab" data-tab="history"><span>🗓️</span>Historique</button>
    <button data-act="tab" data-tab="stats"><span>📈</span>Progrès</button>
  </nav>

  <div id="toast" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
