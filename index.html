<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16191b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Séances</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main"></main>

  <div id="timer" hidden>
    <span id="timerLabel">Repos</span>
    <strong id="timerVal"></strong>
    <button data-act="timerAdd">+15 s</button>
    <button data-act="timerStop">Passer</button>
  </div>

  <nav id="tabbar" class="glassbar" aria-label="Navigation"></nav>

  <div id="toast" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
